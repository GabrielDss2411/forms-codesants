<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Diagnóstico Inicial da Empresa · CodeSants</title>
<meta name="description" content="Diagnóstico inicial CodeSants: a primeira etapa do nosso processo de descoberta, antes de qualquer proposta." />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="./logo.svg" type="image/svg+xml" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

<!-- Geração de PDF direto no navegador (download sem diálogo de impressão) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.3/html2pdf.bundle.min.js" defer></script>

<style>
/* ============================================================
   CodeSants · Design tokens (espelham web/app/globals.css)
   ============================================================ */
:root{
  --bg:#07100b; --surface:#0c150f; --surface-2:#0a120d; --panel:#0e1812;
  --ink:#eaf2ec; --ink-bright:#f3f8f4; --ink-invert:#04140c;
  --muted:#a7bbae; --muted-2:#8ba194; --subtle:#9db0a4; --faint:#5c7065;
  --brand:#3ddc84; --brand-2:#2bd4c0; --brand-soft:#7fe3ab;
  --line:rgba(255,255,255,.09); --line-soft:rgba(255,255,255,.05);
  --danger:#ff8080;

  --font-sans:"Hanken Grotesk",system-ui,sans-serif;
  --font-display:"Space Grotesk",system-ui,sans-serif;
  --font-mono:"Space Mono",ui-monospace,monospace;

  --radius:12px; --radius-lg:16px; --radius-xl:20px; --radius-2xl:22px;
  --ease-out-expo:cubic-bezier(.16,1,.3,1);
  --ease-in-expo:cubic-bezier(.7,0,.84,0);

  --maxw:720px;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; min-height:100vh; min-height:100dvh;
  background:var(--bg); color:var(--ink);
  font-family:var(--font-sans); -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
::selection{background:rgba(61,220,132,.28); color:#fff}

*{scrollbar-width:thin; scrollbar-color:rgba(61,220,132,.45) transparent}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--brand),var(--brand-2));border-radius:999px;border:3px solid var(--bg);background-clip:padding-box}

/* ---------- Backdrop (dotted grid + glow) ---------- */
.bg-fx{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    radial-gradient(circle at 50% 12%,rgba(61,220,132,.14),transparent 55%),
    radial-gradient(circle at 82% 78%,rgba(43,212,192,.08),transparent 46%),
    radial-gradient(rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:auto,auto,30px 30px;}
.bg-orb{position:fixed;left:50%;top:-260px;z-index:0;width:640px;height:640px;
  transform:translateX(-50%);pointer-events:none;
  background:radial-gradient(circle,rgba(61,220,132,.16),transparent 62%);
  filter:blur(8px);animation:orb 7s var(--ease-out-expo) infinite}
@keyframes orb{0%,100%{opacity:.8;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.06)}}

/* ---------- Progress rail (fixo no topo) ---------- */
.rail{position:fixed;top:0;left:0;right:0;height:3px;z-index:40;background:rgba(255,255,255,.06)}
.rail__fill{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand-2));
  box-shadow:0 0 14px rgba(61,220,132,.55);transition:width .5s var(--ease-out-expo)}

/* ---------- Topbar ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:30;
  display:flex;align-items:center;justify-content:space-between;
  padding:20px clamp(18px,4vw,44px);}
.brand{display:inline-flex;align-items:center;gap:9px;font-family:var(--font-display);
  font-weight:700;font-size:17px;letter-spacing:-.01em;color:var(--ink-bright);text-decoration:none}
.brand__dot{width:9px;height:9px;border-radius:50%;background:var(--brand);
  box-shadow:0 0 12px var(--brand)}
.top__meta{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint)}
.top__meta b{color:var(--brand-soft);font-weight:400}

/* ---------- Stage ---------- */
.stage{position:relative;z-index:10;min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;justify-content:center;
  padding:110px clamp(18px,5vw,44px) 132px;}
.wrap{width:100%;max-width:var(--maxw);margin:0 auto}

/* ---------- Step animation ---------- */
.step{display:none}
.step.is-active{display:block;animation:stepIn .42s var(--ease-out-expo) both}
.step.is-leaving{animation:stepOut .26s var(--ease-in-expo) both}
@keyframes stepIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes stepOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-10px)}}

/* ---------- Eyebrow / part label ---------- */
.eyebrow{display:inline-flex;align-items:center;gap:10px;margin-bottom:22px}
.eyebrow__dot{width:6px;height:6px;border-radius:50%;background:var(--brand);box-shadow:0 0 10px var(--brand)}
.eyebrow__txt{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--brand)}
.qnum{font-family:var(--font-mono);font-size:12px;color:var(--faint);letter-spacing:.12em}
.qnum b{color:var(--brand-soft);font-weight:400}

/* ---------- Question typography ---------- */
.q{font-family:var(--font-display);font-weight:600;line-height:1.12;
  letter-spacing:-.02em;color:var(--ink-bright);
  font-size:clamp(26px,4.2vw,42px);margin:14px 0 0}
.q--sm{font-size:clamp(23px,3.4vw,34px)}
.q .hl{background:linear-gradient(110deg,var(--brand),var(--brand-2));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.hint{margin:18px 0 0;color:var(--muted);font-size:16px;line-height:1.6;max-width:56ch}
.hint ul{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.hint ul li{font-size:13.5px;color:var(--muted-2);background:rgba(255,255,255,.04);
  border:1px solid var(--line-soft);border-radius:999px;padding:5px 13px}

/* ---------- Fields ---------- */
.field{margin-top:30px}
textarea.inp{
  width:100%;min-height:140px;resize:vertical;
  background:var(--surface-2);border:1px solid var(--line);border-radius:14px;
  color:var(--ink);font-family:var(--font-sans);font-size:16.5px;line-height:1.6;
  padding:16px 18px;outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
textarea.inp:focus{border-color:var(--brand);background:#0b140e;
  box-shadow:0 0 0 4px rgba(61,220,132,.12)}
textarea.inp::placeholder{color:var(--faint)}
input.inp-line{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;
  color:var(--ink);font-family:var(--font-sans);font-size:17px;line-height:1.4;
  padding:17px 18px;outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
input.inp-line:focus{border-color:var(--brand);background:#0b140e;box-shadow:0 0 0 4px rgba(61,220,132,.12)}
input.inp-line::placeholder{color:var(--faint)}

/* choices */
.choices{display:flex;flex-direction:column;gap:11px}
/* Complemento em texto abaixo das opções (perguntas com `detail`). */
textarea.inp.detail{margin-top:14px;min-height:104px;font-size:15.5px}
.choice{position:relative;display:flex;align-items:center;gap:14px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:14px;
  padding:16px 18px;text-align:left;color:var(--ink);font-size:16px;
  font-family:var(--font-sans);cursor:pointer;width:100%;
  transition:transform .18s var(--ease-out-expo),border-color .18s,background .18s}
.choice:hover{transform:translateX(3px);border-color:var(--brand);background:rgba(61,220,132,.06)}
.choice__mark{flex:0 0 auto;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--faint);
  display:grid;place-items:center;transition:.18s;font-size:13px;color:var(--ink-invert)}
.choice[data-shape="radio"] .choice__mark{border-radius:50%}
.choice__mark::after{content:"";width:9px;height:9px;border-radius:inherit;background:var(--brand);
  transform:scale(0);transition:transform .18s var(--ease-out-expo)}
.choice.is-on{border-color:var(--brand);background:rgba(61,220,132,.1);
  box-shadow:inset 0 0 0 1px rgba(61,220,132,.35)}
.choice.is-on .choice__mark{border-color:var(--brand);background:var(--brand)}
.choice.is-on[data-shape="check"] .choice__mark::after{content:"✓";width:auto;height:auto;background:none;transform:scale(1);font-weight:700}
.choice.is-on[data-shape="radio"] .choice__mark::after{transform:scale(1);background:var(--ink-invert)}
.choice__key{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--faint);
  border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.choice:hover .choice__key{color:var(--brand-soft);border-color:rgba(61,220,132,.3)}
.other-wrap{margin-top:11px;max-height:0;overflow:hidden;opacity:0;transition:max-height .32s var(--ease-out-expo),opacity .3s}
.other-wrap.is-open{max-height:120px;opacity:1}
.other-wrap input{width:100%;background:var(--surface-2);border:1px solid var(--line);
  border-radius:12px;color:var(--ink);font-family:var(--font-sans);font-size:15.5px;
  padding:13px 16px;outline:none;transition:border-color .2s}
.other-wrap input:focus{border-color:var(--brand)}

/* ---------- Footer nav ---------- */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;
  display:flex;align-items:center;gap:16px;
  padding:16px clamp(18px,5vw,44px);
  background:linear-gradient(180deg,transparent,rgba(7,16,11,.86) 42%);
  backdrop-filter:blur(6px)}
.nav[hidden]{display:none}
.nav__inner{width:100%;max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:16px}
.grow{flex:1}
.btn{font-family:var(--font-display);font-weight:600;cursor:pointer;border:0;
  border-radius:12px;transition:transform .18s var(--ease-out-expo),filter .2s,background .2s,opacity .2s}
.btn:disabled{cursor:not-allowed;opacity:.4;filter:saturate(.4)}
.btn--back{background:none;color:var(--subtle);padding:12px 8px;font-size:14.5px}
.btn--back:hover:not(:disabled){color:var(--ink)}
.btn--go{display:inline-flex;align-items:center;gap:9px;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));color:var(--ink-invert);
  padding:14px 26px;font-size:15.5px;box-shadow:0 10px 30px rgba(61,220,132,.28)}
.btn--go:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.08)}
.btn--ghost{background:rgba(255,255,255,.05);border:1px solid var(--line);color:#dceee4;padding:13px 22px;font-size:15px}
.btn--ghost:hover{background:rgba(255,255,255,.1)}

/* ---------- Intro / welcome ---------- */
.intro__kicker{font-family:var(--font-mono);font-size:12px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--brand);margin-bottom:20px;display:block}
.intro h1{font-family:var(--font-display);font-weight:700;letter-spacing:-.025em;
  line-height:1.02;font-size:clamp(38px,7vw,72px);margin:0;color:var(--ink-bright)}
/* Mesmo destaque em gradiente usado nas perguntas (.q .hl). */
.intro h1 .hl{background:linear-gradient(110deg,var(--brand),var(--brand-2));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.intro p{color:var(--muted);font-size:clamp(16px,2.2vw,18.5px);line-height:1.66;
  max-width:60ch;margin:22px 0 0}
.intro p + p{margin-top:14px}
.meta-chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px}
.chip{display:inline-flex;align-items:center;gap:9px;font-size:13.5px;color:var(--muted);
  background:rgba(255,255,255,.035);border:1px solid var(--line-soft);border-radius:999px;padding:9px 16px}
.chip svg{width:15px;height:15px;color:var(--brand)}
.intro .btn--go{margin-top:38px;padding:16px 30px;font-size:16px}

/* ---------- Review ---------- */
.review h2{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,4vw,38px);
  letter-spacing:-.02em;color:var(--ink-bright);margin:14px 0 0;line-height:1.1}
.review .lead{color:var(--muted);font-size:16px;margin:16px 0 26px;line-height:1.6}
.rev-list{border:1px solid var(--line-soft);border-radius:16px;overflow:hidden;
  background:linear-gradient(180deg,var(--panel),#0a130d)}
.rev-item{display:grid;grid-template-columns:34px 1fr auto;gap:14px;align-items:start;
  padding:15px 18px;border-bottom:1px solid var(--line-soft);cursor:pointer;transition:background .18s}
.rev-item:last-child{border-bottom:0}
.rev-item:hover{background:rgba(61,220,132,.05)}
.rev-item__n{font-family:var(--font-mono);font-size:12px;color:var(--faint);padding-top:3px}
.rev-item__q{font-size:13px;color:var(--muted-2);margin-bottom:5px;line-height:1.35}
.rev-item__a{font-size:15px;color:var(--ink);line-height:1.5;white-space:pre-wrap;word-break:break-word}
.rev-item__a.empty{color:var(--faint);font-style:italic}
.rev-item__edit{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);opacity:0;transition:opacity .18s;align-self:center}
.rev-item:hover .rev-item__edit{opacity:1;color:var(--brand-soft)}

/* ---------- Done ---------- */
.done{text-align:center;padding:20px 0}
.done__check{width:74px;height:74px;border-radius:50%;margin:0 auto 26px;display:grid;place-items:center;
  background:rgba(61,220,132,.14);color:var(--brand);font-size:34px;
  box-shadow:0 0 0 1px rgba(61,220,132,.3),0 0 40px rgba(61,220,132,.22)}
.done h2{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,4.5vw,42px);
  letter-spacing:-.02em;color:var(--ink-bright);margin:0}
.done h2 .hl{background:linear-gradient(110deg,var(--brand),var(--brand-2));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.done p{color:var(--muted);font-size:16.5px;line-height:1.6;max-width:52ch;margin:18px auto 0}
/* Primeira e última linhas do texto de fechamento, com um pouco mais de peso. */
.done__lead{color:var(--ink)!important;font-size:18px!important;margin-top:22px!important}
.done__sign{color:var(--brand-soft)!important;font-family:var(--font-display);font-weight:600;
  font-size:18px!important;margin-top:26px!important}
.done__next{color:var(--muted-2);font-size:14.5px;line-height:1.55;max-width:46ch;margin:30px auto 0;
  padding-top:26px;border-top:1px solid var(--line-soft)}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:34px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);z-index:60;
  background:var(--panel);border:1px solid rgba(61,220,132,.3);color:var(--ink);
  font-size:14px;padding:12px 20px;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s var(--ease-out-expo)}
.toast.is-on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- Chapter interstitial (troca de parte) ---------- */
.chapter-ov{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:center;
  padding:0 clamp(18px,5vw,44px);cursor:pointer;
  background:radial-gradient(circle at 50% 38%,rgba(61,220,132,.16),transparent 60%),var(--bg);
  opacity:0;transition:opacity .5s var(--ease-out-expo)}
.chapter-ov.is-in{opacity:1}
.chapter-ov .inner{width:100%;max-width:var(--maxw);margin:0 auto}
.chapter-ov .num{display:flex;align-items:center;gap:13px;font-family:var(--font-mono);
  font-size:13px;letter-spacing:.26em;text-transform:uppercase;color:var(--brand);
  transform:translateY(14px);opacity:0;transition:transform .55s var(--ease-out-expo),opacity .55s}
.chapter-ov .num .line{height:1px;width:52px;background:linear-gradient(90deg,var(--brand),transparent)}
.chapter-ov.is-in .num{transform:none;opacity:1}
.chapter-ov h2{font-family:var(--font-display);font-weight:700;letter-spacing:-.025em;line-height:1.03;
  font-size:clamp(36px,6.5vw,68px);color:var(--ink-bright);margin:22px 0 0;max-width:16ch;
  transform:translateY(20px);opacity:0;transition:transform .6s var(--ease-out-expo) .1s,opacity .6s .1s}
.chapter-ov.is-in h2{transform:none;opacity:1}
/* Texto de transição: aparece só nas partes que têm algo a explicar. */
.chapter-ov .lead{color:var(--muted);font-size:clamp(15.5px,2vw,18px);line-height:1.6;
  max-width:54ch;margin:22px 0 0;
  transform:translateY(20px);opacity:0;transition:transform .6s var(--ease-out-expo) .16s,opacity .6s .16s}
.chapter-ov.is-in .lead{transform:none;opacity:1}
.chapter-ov .segs{display:flex;gap:9px;margin-top:38px;max-width:360px;
  transform:translateY(20px);opacity:0;transition:transform .6s var(--ease-out-expo) .2s,opacity .6s .2s}
.chapter-ov.is-in .segs{transform:none;opacity:1}
.chapter-ov .seg{height:4px;flex:1;border-radius:999px;background:rgba(255,255,255,.09);overflow:hidden}
.chapter-ov .seg.on{background:linear-gradient(90deg,var(--brand),var(--brand-2));box-shadow:0 0 12px rgba(61,220,132,.5)}
.chapter-ov .tap{margin-top:26px;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.1em;color:var(--faint);
  opacity:0;transition:opacity .5s .5s}
.chapter-ov.is-in .tap{opacity:1}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .chapter-ov,.chapter-ov .num,.chapter-ov h2,.chapter-ov .segs,.chapter-ov .tap{opacity:1;transform:none}
}

/* ============================================================
   Documento PDF (relatório) — layout claro "papel", acentos verdes.
   Oculto na tela; renderizado em .pdf-capture (download via html2pdf)
   ou no fallback de impressão.
   ============================================================ */
.pdf-doc{display:none;background:#fff;color:#0d1b13;font-family:var(--font-sans)}
.pdf-doc.pdf-capture{display:block;position:static;width:794px;margin:0;
  padding:44px 46px;box-sizing:border-box}
/* overlay que cobre a tela enquanto o PDF é rasterizado */
.pdf-loading{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;
  background:radial-gradient(circle at 50% 40%,rgba(61,220,132,.14),transparent 60%),var(--bg)}
.pdf-loading .spin{width:52px;height:52px;border-radius:50%;
  border:3px solid rgba(61,220,132,.2);border-top-color:var(--brand);animation:csSpin .8s linear infinite}
.pdf-loading .lbl{font-family:var(--font-mono);font-size:12px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--brand-soft)}

.pdf-cover{padding-bottom:26px;margin-bottom:30px;border-bottom:2px solid #14b866;page-break-after:avoid}
.pdf-cover .pdf-logo{display:flex;align-items:center;gap:9px;font-family:var(--font-display);
  font-weight:700;font-size:26px;letter-spacing:-.01em;color:#14b866;margin-bottom:24px}
.pdf-cover .pdf-dot{width:9px;height:9px;border-radius:50%;background:#14b866;display:inline-block}
.pdf-cover .pk{font-family:var(--font-mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#12a85c;margin-bottom:10px}
.pdf-cover h1{font-family:var(--font-display);font-weight:700;font-size:34px;letter-spacing:-.02em;line-height:1.05;color:#0a1a11;margin:0}
.pdf-cover .sub{color:#3f574a;font-size:12.5px;line-height:1.6;max-width:70ch;margin:14px 0 0}
.pdf-cover .meta{display:flex;gap:22px;flex-wrap:wrap;margin-top:18px;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:#5a7365;text-transform:uppercase}
.pdf-cover .meta b{color:#12a85c;font-weight:700}
.pdf-who{display:flex;gap:14px;flex-wrap:wrap;margin-top:20px}
.pdf-who div{flex:1;min-width:150px;border:1px solid #cfe9da;border-radius:10px;padding:11px 14px;background:#f2faf5}
.pdf-who span{display:block;font-family:var(--font-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#5a8a70;margin-bottom:4px}
.pdf-who b{font-family:var(--font-display);font-size:14px;color:#0a1a11;font-weight:600}
.pdf-part{font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#0f8a4d;margin:24px 0 14px;padding-bottom:7px;border-bottom:1px solid #cfe9da;page-break-after:avoid;break-after:avoid}
.pdf-qa{margin:0 0 16px;page-break-inside:avoid;break-inside:avoid}
.pdf-q{display:flex;gap:10px;font-family:var(--font-display);font-weight:600;font-size:13px;line-height:1.35;color:#0a1a11}

.pdf-a.empty{color:#9bb0a4;font-style:italic;border-left-color:#e2ede7}

<body>
<div class="bg-fx"></div>
<div class="bg-orb"></div>

<div class="rail"><div class="rail__fill" id="rail"></div></div>

<header class="top">
  <a class="brand" href="#" aria-label="CodeSants"><span class="brand__dot"></span>CodeSants</a>
  <span class="top__meta" id="topMeta"></span>

  <div class="wrap" id="stageWrap"><!-- steps injetados aqui --></div>

<footer class="nav" id="navBar" hidden>
  <div class="nav__inner">
    <button class="btn btn--back" id="btnBack" type="button">← Voltar</button>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
   Diagnóstico Inicial da Empresa · CodeSants
   Formulário multi-step (typeform-style), 100% autônomo.
   ============================================================ */

const CONTACT = { email: "contato@codesants.com.br" };

/* Endpoint do CRM que recebe as respostas ao concluir o formulário.
   Vazio = não envia nada (o formulário segue funcionando normalmente).
   Preencha com a URL do CRM publicado, por exemplo:
     const CRM_ENDPOINT = "https://crm-codesants.vercel.app/api/diagnosticos";
   CRM_TOKEN é opcional e só precisa existir se o CRM definir CRM_INGEST_TOKEN.
   Como esta página é pública, esse token corta ruído automatizado — não é
   segredo de verdade. */
const CRM_ENDPOINT = "";
const CRM_TOKEN    = "";

/* ---- Estrutura das perguntas (fiel ao forms.md) ---- */
const QUESTIONS = [
  // Identificação
  { id:"nome", part:"Identificação", type:"text",
    q:["Para começar, ","com quem eu falo?"],

  // Parte 1

    hint:"Essa resposta normalmente revela muito sobre o posicionamento da marca.",

  // Parte 2
  { id:"q5", part:"Parte 2 · Entendendo o momento da empresa", type:"long",

    hint:"Quais são os maiores desafios que vocês enfrentam atualmente?",

  { id:"q8", part:"Parte 2 · Entendendo o momento da empresa", type:"long",

  { id:"q9", part:"Parte 2 · Entendendo o momento da empresa", type:"single",

    options:["Até R$ 20 mil","R$ 20 mil a R$ 50 mil","R$ 50 mil a R$ 100 mil","R$ 100 mil a R$ 300 mil","Acima de R$ 300 mil","Prefiro não informar"] },
  { id:"q10", part:"Parte 2 · Entendendo o momento da empresa", type:"long",

    ph:"Onde vocês querem chegar em 12 meses…" },

  // Parte 3
  { id:"q11", part:"Parte 3 · Um site que realmente gere resultado", type:"long",
    q:["Nos primeiros 10 segundos no site, ","o que o visitante deveria pensar?"],
    hint:"Essa resposta vai definir toda a comunicação da página inicial.",
    ph:"“Nossa, essa empresa…”" },
  { id:"q12", part:"Parte 3 · Um site que realmente gere resultado", type:"single",
    q:["Depois desses 10 segundos, ","qual deveria ser a próxima atitude?"],

  { id:"q13", part:"Parte 3 · Um site que realmente gere resultado", type:"long",
    q:["Quem é o ","cliente ideal da sua empresa?"],
    hint:"Não pense em “todo mundo”. Pense em quem você gostaria de atender todos os dias.",
    ph:"A pessoa ou empresa dos sonhos para atender…" },
  { id:"q14", part:"Parte 3 · Um site que realmente gere resultado", type:"long",
    q:["Por que um cliente ","escolhe vocês e não um concorrente?"],
    hint:"Se puder, conte situações reais.",
    ph:"O que faz a diferença na hora da escolha…" },
  { id:"q15", part:"Parte 3 · Um site que realmente gere resultado", type:"long",
    q:["Existe algum serviço que vocês ","gostariam de vender mais?"],
    hint:"Mesmo que hoje ele não seja o mais procurado.",
    ph:"O serviço que merece mais holofote…" },
  { id:"q16", part:"Parte 3 · Um site que realmente gere resultado", type:"long",
    q:["Quais dúvidas os clientes têm ","antes de contratar vocês?"],
    hint:"Provavelmente serão respondidas dentro do próprio site.",
    ph:"As perguntas que aparecem antes do sim…" },
  { id:"q17", part:"Parte 3 · Um site que realmente gere resultado", type:"long",
    q:["Se um concorrente visitasse seu site, ","o que gostaria que ele percebesse?"],
    hint:"Costuma revelar o verdadeiro diferencial competitivo.",
    ph:"O que você quer que a concorrência veja…" },
  { id:"q18", part:"Parte 3 · Um site que realmente gere resultado", type:"multi",
    q:["Existe algo que você ","definitivamente NÃO quer transmitir?"],
    hint:"Selecione o que quer evitar e complemente se precisar.",
    options:["Empresa pequena","Empresa amadora","Empresa cara","Empresa popular","Empresa fria","Empresa distante"], other:true },
  { id:"q19", part:"Parte 3 · Um site que realmente gere resultado", type:"long",
    q:["Quais empresas transmitem uma ","imagem que você admira?"],
    hint:"Podem ser do seu segmento ou não. Pode enviar links: o objetivo não é copiar, mas entender referências.",
    ph:"Marcas de referência (com links, se tiver)…" },
  { id:"q20", part:"Parte 3 · Um site que realmente gere resultado", type:"multi",
    q:["Quais ","materiais vocês já possuem?"],
    hint:"Selecione tudo que já está pronto.",
    options:["Logo","Manual da marca","Fotos profissionais","Vídeos","Depoimentos","Cases","Avaliações","Portfólio"], other:true },

  // Parte 4
  { id:"q21", part:"Parte 4 · Além do site", type:"multi",
    q:["Existe algum processo da empresa que ","poderia ser mais eficiente?"],
    hint:"Selecione as áreas e conte um pouco sobre isso no campo abaixo.",
    options:["Atendimento","Comercial","Marketing","Financeiro","Operação","Gestão","Comunicação"],
    other:true, detail:"Conte um pouco sobre isso…" },
  { id:"q22", part:"Parte 4 · Além do site", type:"long",
    q:["Existe alguma ","atividade repetitiva"," que consome muito tempo da equipe?"],
    hint:"Pode ser algo feito manualmente todos os dias ou várias vezes por semana.",
    ph:"O que se repete e quanto tempo leva…" },
  { id:"q23", part:"Parte 4 · Além do site", type:"long",
    q:["Se você pudesse resolver ","apenas um problema"," da empresa através da tecnologia, qual seria?"],
    hint:"Não precisa saber qual seria a solução. Quero entender qual desafio mais impacta o dia a dia do negócio.",
    ph:"O problema que mais pesa…" },
  { id:"q24", part:"Parte 4 · Além do site", type:"long",
    q:["Vocês usam alguma ferramenta ou sistema que ","não atende mais à empresa?"],
    hint:"Se sim, qual? E o que falta nela?",
    ph:"A ferramenta e o que está faltando…" },
  { id:"q25", part:"Parte 4 · Além do site", type:"long",
    q:["Existe algum ","projeto ou ideia"," que vocês gostariam de colocar em prática no futuro?"],
    hint:"Mesmo que ainda não seja prioridade.",
    ph:"A ideia que ainda não saiu do papel…" },

  // Final
  { id:"q26", part:"A última pergunta, e a mais importante", type:"long", featured:true,
    q:["Daqui a um ano, você diz: ",["“esse projeto superou minhas expectativas”"],". O que precisaria ter acontecido?"],
    hint:"Não pense apenas no site em si, mas nos resultados que ele teria gerado para a sua empresa.",
    ph:"O cenário de sucesso, um ano depois…" },
];

const TOTAL = QUESTIONS.length;
const PARTS = [...new Set(QUESTIONS.map(q => q.part))];   // partes únicas, em ordem

/* ---- Estado ---- */
let answers = {};        // { qid: string | string[], qid__other: string }
let idx = -1;            // -1 intro · 0..TOTAL-1 perguntas · TOTAL review · TOTAL+1 done
const REVIEW = TOTAL, DONE = TOTAL + 1;

/* ---- Persistência desativada nesta etapa (navegação livre, sem salvar) ---- */
function save(){ /* no-op */ }

/* ---- Helpers de render ---- */
const el = (t,c,html)=>{ const n=document.createElement(t); if(c)n.className=c; if(html!=null)n.innerHTML=html; return n; };
function qTitle(parts){
  return parts.map(p => Array.isArray(p) ? `<span class="hl">${p[0]}</span>` : escapeHtml(p)).join("");
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

const wrap = document.getElementById("stageWrap");
const rail = document.getElementById("rail");
const topMeta = document.getElementById("topMeta");
const navBar = document.getElementById("navBar");
const btnBack = document.getElementById("btnBack");
const btnNext = document.getElementById("btnNext");

/* ---- Render principal ---- */
function render(){
  // progress + topbar
  if(idx < 0){ rail.style.width = "0%"; topMeta.innerHTML = "Diagnóstico Inicial"; navBar.hidden = true; }
  else if(idx >= REVIEW){ rail.style.width = "100%"; topMeta.innerHTML = idx===DONE ? "Concluído" : "Revisão final"; }
  else{ rail.style.width = ((idx+1)/TOTAL*100)+"%"; topMeta.innerHTML = `Pergunta <b>${idx+1}</b> / ${TOTAL}`; }

  const old = wrap.querySelector(".step.is-active");
  const build = ()=>{
    wrap.innerHTML = "";
    let node;
    if(idx < 0) node = buildIntro();
    else if(idx === REVIEW) node = buildReview();
    else if(idx === DONE) node = buildDone();
    else node = buildQuestion(QUESTIONS[idx]);
    node.classList.add("step");
    wrap.appendChild(node);
    requestAnimationFrame(()=>node.classList.add("is-active"));
    setupNav();
    focusFirst(node);
    window.scrollTo({top:0, behavior:"instant" in window ? "instant" : "auto"});
  };
  if(old){ old.classList.add("is-leaving"); setTimeout(build, 180); } else build();
}

function focusFirst(node){
  if(chapterActive) return;   // não roubar foco durante a troca de parte
  const f = node.querySelector("textarea, .choice, .btn--go, input");
  if(f) setTimeout(()=>{ if(!chapterActive) f.focus(); }, 220);
}

/* ---- Intro ---- */
function buildIntro(){
  const s = el("section","intro");
  s.innerHTML = `
    <span class="intro__kicker">CodeSants · Olhar Humano</span>
    <h1>Diagnóstico<br><span class="hl">Inicial da Empresa</span></h1>
    <p>Olá! Obrigado pelo interesse em desenvolver seu projeto conosco. Embora o ponto de partida seja a criação de um site, um bom projeto começa entendendo como a empresa funciona, como ela se posiciona no mercado e quais resultados deseja alcançar.</p>
    <p>Este formulário é a primeira etapa do nosso processo de descoberta. Com as respostas, conseguimos identificar oportunidades de comunicação, vendas, automação e tecnologia que gerem impacto real no negócio.</p>
    <div class="meta-chips">
      <span class="chip">${icon('clock')} De 10 a 15 minutos</span>
      <span class="chip">${icon('nav')} Navegue livremente entre as etapas</span>
      <span class="chip">${icon('lock')} Confidencial</span>
    </div>
    <button class="btn btn--go" id="introGo" type="button">Começar diagnóstico →</button>
  `;
  s.querySelector("#introGo").addEventListener("click", ()=> go(0));
  return s;
}

/* ---- Pergunta ---- */
function buildQuestion(qd){
  const s = el("section","step-q");
  const num = String(QUESTIONS.indexOf(qd)+1).padStart(2,"0");
  s.appendChild(el("div","eyebrow",`<span class="eyebrow__dot"></span><span class="eyebrow__txt">${escapeHtml(qd.part)}</span>`));
  s.appendChild(el("div","qnum",`<b>${num}</b> / ${String(TOTAL).padStart(2,"0")}`));
  s.appendChild(el("h2","q"+(qd.featured?"":" q--sm"), qTitle(qd.q)));
  if(qd.hint){
    const h = el("p","hint", escapeHtml(qd.hint));
    if(qd.tags){ const ul=el("ul"); qd.tags.forEach(t=>ul.appendChild(el("li",null,escapeHtml(t)))); h.appendChild(ul); }
    s.appendChild(h);
  }

  const field = el("div","field");
  if(qd.type === "long"){
    const ta = el("textarea","inp");
    ta.placeholder = qd.ph || "Escreva aqui…";
    ta.value = answers[qd.id] || "";
    ta.setAttribute("aria-label", stripTags(qTitle(qd.q)));
    ta.addEventListener("input", ()=>{ answers[qd.id]=ta.value; save(); syncNav(qd); });
    field.appendChild(ta);
  } else if(qd.type === "text" || qd.type === "tel" || qd.type === "email"){
    const inp = el("input","inp inp-line");
    inp.type = qd.type === "text" ? "text" : qd.type;
    if(qd.type === "tel"){ inp.inputMode = "tel"; inp.autocomplete = "tel"; }
    if(qd.id === "nome"){ inp.autocomplete = "name"; }
    if(qd.id === "empresa"){ inp.autocomplete = "organization"; }
    if(qd.type === "email"){ inp.inputMode = "email"; inp.autocomplete = "email"; }
    inp.placeholder = qd.ph || "";
    inp.value = answers[qd.id] || "";
    inp.setAttribute("aria-label", stripTags(qTitle(qd.q)));
    inp.addEventListener("input", ()=>{ answers[qd.id]=inp.value; save(); syncNav(qd); });
    inp.addEventListener("keydown", (e)=>{ if(e.key==="Enter"){ e.preventDefault(); if(!btnNext.disabled) btnNext.click(); } });
    field.appendChild(inp);
  } else {
    const shape = qd.type === "multi" ? "check" : "radio";
    const box = el("div","choices");
    qd.options.forEach((opt,i)=>{
      const b = el("button","choice"); b.type="button"; b.dataset.shape=shape; b.dataset.val=opt;
      b.innerHTML = `<span class="choice__mark"></span><span>${escapeHtml(opt)}</span>`+
                    (i<9?`<span class="choice__key">${i+1}</span>`:"");
      if(isSelected(qd,opt)) b.classList.add("is-on");
      b.addEventListener("click", ()=>toggle(qd,opt,box,shape));
      box.appendChild(b);
    });
    if(qd.other){
      const b = el("button","choice"); b.type="button"; b.dataset.shape=shape; b.dataset.val="__other";
      b.innerHTML = `<span class="choice__mark"></span><span>Outro</span>`;
      const otherOn = !!(answers[qd.id+"__other"]||"").trim() || (Array.isArray(answers[qd.id]) && answers[qd.id].includes("__other"));
      if(otherOn) b.classList.add("is-on");
      b.addEventListener("click", ()=>toggle(qd,"__other",box,shape,ow));
      box.appendChild(b);
      var ow = el("div","other-wrap"+(otherOn?" is-open":""));
      const inp = el("input"); inp.type="text"; inp.placeholder="Conte com suas palavras…";
      inp.value = answers[qd.id+"__other"]||"";
      inp.addEventListener("input", ()=>{ answers[qd.id+"__other"]=inp.value; save(); syncNav(qd); });
      ow.appendChild(inp); box.appendChild(ow);
    }
    field.appendChild(box);

    /* Complemento em texto para perguntas que pedem "conte um pouco sobre isso":
       marcar a área não responde a pergunta, o relato é que responde. */
    if(qd.detail){
      const det = el("textarea","inp detail");
      det.placeholder = qd.detail;
      det.value = answers[qd.id+"__detalhe"] || "";
      det.setAttribute("aria-label", stripTags(qTitle(qd.q))+" — detalhe");
      det.addEventListener("input", ()=>{ answers[qd.id+"__detalhe"]=det.value; save(); syncNav(qd); });
      field.appendChild(det);
    }
  }
  s.appendChild(field);
  return s;
}
function stripTags(h){ const d=document.createElement("div"); d.innerHTML=h; return d.textContent; }

function isSelected(qd,opt){
  if(qd.type==="single") return answers[qd.id]===opt;
  return Array.isArray(answers[qd.id]) && answers[qd.id].includes(opt);
}
function toggle(qd,opt,box,shape,ow){
  if(qd.type==="single"){
    answers[qd.id]=opt;
    box.querySelectorAll(".choice").forEach(c=>c.classList.toggle("is-on", c.dataset.val===opt));
    save(); syncNav(qd);
    if(opt!=="__other") setTimeout(()=>go(idx+1), 240);   // avanço automático (single)
  } else {
    let arr = Array.isArray(answers[qd.id]) ? answers[qd.id].slice() : [];
    const i = arr.indexOf(opt);
    if(i>=0) arr.splice(i,1); else arr.push(opt);
    answers[qd.id]=arr;
    const btn = box.querySelector(`.choice[data-val="${cssEsc(opt)}"]`);
    if(btn) btn.classList.toggle("is-on", arr.includes(opt));
    save(); syncNav(qd);
  }
  if(opt==="__other" && ow){
    ow.classList.toggle("is-open");
    if(ow.classList.contains("is-open")) setTimeout(()=>ow.querySelector("input").focus(),120);
  }
}
function cssEsc(s){ return String(s).replace(/["\\]/g,"\\$&"); }

/* ---- Revisão ---- */
function buildReview(){
  const s = el("section","review");
  s.appendChild(el("div","eyebrow",`<span class="eyebrow__dot"></span><span class="eyebrow__txt">Revisão final</span>`));
  s.appendChild(el("h2",null,"Tudo pronto. <span class=\"hl\">Revise antes de enviar.</span>"));
  s.appendChild(el("p","lead","Clique em qualquer resposta para editar. Nenhuma pergunta é obrigatória, mas quanto mais completo, melhor o diagnóstico."));
  const list = el("div","rev-list");
  QUESTIONS.forEach((qd,i)=>{
    const item = el("div","rev-item"); item.tabIndex=0; item.setAttribute("role","button");
    const a = answerText(qd);
    item.innerHTML = `<span class="rev-item__n">${String(i+1).padStart(2,"0")}</span>
      <span><span class="rev-item__q">${escapeHtml(shortQ(qd))}</span>
      <span class="rev-item__a ${a?"":"empty"}">${a?escapeHtml(a):"sem resposta"}</span></span>
      <span class="rev-item__edit">Editar</span>`;
    const jump = ()=>go(i);
    item.addEventListener("click", jump);
    item.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();jump();} });
    list.appendChild(item);
  });
  s.appendChild(list);
  return s;
}
function shortQ(qd){ return stripTags(qTitle(qd.q)).replace(/\s+/g," ").trim(); }
function respondent(){
  return {
    nome: (answers.nome || "").trim(),
    empresa: (answers.empresa || "").trim(),
    tel: (answers.telefone || "").trim(),
    email: (answers.email || "").trim(),
  };
}
function answerText(qd){
  const v = answers[qd.id];
  let base = Array.isArray(v) ? v.filter(x=>x!=="__other").join(", ") : (v||"").trim();
  const other = (answers[qd.id+"__other"]||"").trim();
  if(other) base = base ? base+" · Outro: "+other : "Outro: "+other;
  const detalhe = (answers[qd.id+"__detalhe"]||"").trim();
  if(detalhe) base = base ? base+" — "+detalhe : detalhe;
  return base;
}

/* ---- Concluído ----
   Fecha com uma leitura, não com um "Obrigado" seco: diz o que acontece
   agora e quando a pessoa volta a ter notícia. Texto fiel ao forms.md. */
function buildDone(){
  const s = el("section","done");
  s.innerHTML = `
    <div class="done__check">✓</div>
    <h2>Estamos <span class="hl">quase lá!</span></h2>
    <p class="done__lead">Muito obrigado por dedicar esse tempo.</p>
    <p>Acredito que entender profundamente o seu negócio é muito mais importante do que simplesmente executar uma demanda.</p>
    <p>Vou analisar cuidadosamente todas as suas respostas para compreender o momento da empresa, identificar oportunidades e elaborar uma proposta alinhada aos seus objetivos.</p>
    <p>Se durante essa análise eu perceber que existe uma solução mais adequada do que a inicialmente imaginada, entrarei em contato antes de montar a proposta. Prefiro recomendar o que realmente gera resultado para o seu negócio do que entregar apenas aquilo que foi solicitado.</p>
    <p class="done__sign">Nos falamos em breve!</p>
    <p class="done__next">Se quiser, leve uma cópia das suas respostas.</p>
    <div class="actions">
      <button class="btn btn--go" id="doPdf" type="button">Baixar PDF do diagnóstico ↓</button>
    </div>
  `;
  s.querySelector("#doPdf").addEventListener("click", generatePdf);
  return s;
}

/* ---- Documento / PDF ---- */
function buildPdfDoc(){
  document.querySelectorAll(".pdf-doc").forEach(n=>n.remove());
  const doc = el("div","pdf-doc");
  let curPart = "", body = "";
  QUESTIONS.forEach((qd,i)=>{
    if(qd.part!==curPart){ curPart=qd.part; body += `<div class="pdf-part">${escapeHtml(curPart)}</div>`; }
    const a = answerText(qd);
    body += `<div class="pdf-qa">
      <div class="pdf-q"><span class="qn">${String(i+1).padStart(2,"0")}</span><span>${escapeHtml(shortQ(qd))}</span></div>
      <div class="pdf-a ${a?"":"empty"}">${a?escapeHtml(a):"não respondido"}</div>
    </div>`;
  });
  const r = respondent();
  const whoRows = [
    r.empresa && `<div><span>Empresa</span><b>${escapeHtml(r.empresa)}</b></div>`,
    r.nome && `<div><span>Respondente</span><b>${escapeHtml(r.nome)}</b></div>`,
    r.tel && `<div><span>Contato</span><b>${escapeHtml(r.tel)}</b></div>`,
    r.email && `<div><span>E-mail</span><b>${escapeHtml(r.email)}</b></div>`,
  ].filter(Boolean).join("");

  doc.innerHTML = `
    <header class="pdf-cover">
      <div class="pdf-logo"><span class="pdf-dot"></span>CodeSants</div>
      <div class="pk">Diagnóstico Inicial · Confidencial</div>
      <h1>Diagnóstico Inicial da Empresa</h1>
      <p class="sub">Antes de qualquer proposta, entendemos profundamente o negócio. Este documento reúne as respostas do diagnóstico que vão orientar a estratégia e a construção do projeto.</p>
      ${whoRows ? `<div class="pdf-who">${whoRows}</div>` : ""}
      <div class="meta"><span>Gerado em <b>${new Date().toLocaleDateString("pt-BR")}</b></span><span>CodeSants · <b>${CONTACT.email}</b></span></div>
    </header>
    ${body}
    <div class="pdf-foot"><span>CodeSants · Olhar Humano</span><span>Documento confidencial · gerado pelo Diagnóstico Inicial</span></div>
  `;
  document.body.appendChild(doc);
  return doc;
}
function pdfFilename(){
  const r = respondent();
  const slug = (r.empresa || r.nome || "codesants")
    .toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"") || "codesants";
  return `diagnostico-estrategico-${slug}.pdf`;
}
async function generatePdf(){
  const btn = document.getElementById("doPdf");
  const doc = buildPdfDoc();

  // Sem a biblioteca (offline): cai para o diálogo de impressão.
  if(!window.html2pdf){ printFallback(); return; }

  if(btn) btn.disabled = true;
  // Renderiza o documento na tela (0,0) para o html2canvas capturar corretamente,
  // mas escondido atrás de um overlay de carregamento (o usuário não vê o "papel").
  const overlay = el("div","pdf-loading");
  overlay.innerHTML = `<div class="spin"></div><div class="lbl">Gerando seu PDF…</div>`;
  document.body.appendChild(overlay);
  doc.classList.add("pdf-capture");
  window.scrollTo(0, 0);
  try{
    // aguarda fontes e imagem (logo) carregarem antes de rasterizar
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const img = doc.querySelector("img");
    if(img && !img.complete) await new Promise(r => { img.onload = img.onerror = r; });

    await window.html2pdf().set({
      margin: [10, 10, 12, 10],
      filename: pdfFilename(),
      image: { type: "jpeg", quality: 0.98 },
      html2canvas: { scale: 2, backgroundColor: "#ffffff", useCORS: true, logging: false },
      jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
      pagebreak: { mode: ["css", "legacy"], avoid: [".pdf-qa", ".pdf-part"] },
    }).from(doc).save();

    toast("PDF baixado ✓");
    doc.remove();
    overlay.remove();
    if(btn) btn.disabled = false;
  }catch(e){
    overlay.remove();
    if(btn) btn.disabled = false;
    printFallback();   // mantém o .pdf-doc no DOM para a impressão
  }
}
function printFallback(){
  toast("Abrindo a impressão. Escolha “Salvar como PDF”.");
  const cleanup = ()=>{ document.querySelectorAll(".pdf-doc").forEach(n=>n.remove()); window.removeEventListener("afterprint", cleanup); };
  window.addEventListener("afterprint", cleanup);
  setTimeout(()=>window.print(), 200);
}
/* ---- Navegação ---- */
function setupNav(){
  if(idx<0 || idx===DONE){ navBar.hidden=true; return; }
  navBar.hidden=false;
  btnBack.style.visibility = idx===0 ? "hidden" : "visible";
  btnBack.textContent = "← Voltar";
  btnNext.disabled = false;   // navegação sempre livre entre as etapas
  if(idx===REVIEW) btnNext.innerHTML = "Concluir →";
  else btnNext.innerHTML = idx===TOTAL-1 ? "Revisar respostas →" : "Continuar →";
}
function syncNav(){ /* navegação livre, sem bloqueio por resposta */ }

function go(n){
  const forward = n > idx;
  n = Math.max(-1, Math.min(DONE, n));
  // Anuncia a troca de parte ao AVANÇAR para a 1ª pergunta de uma nova parte.
  const entersNewPart = forward && n > 0 && n < TOTAL && QUESTIONS[n].part !== QUESTIONS[n-1].part;
  const conclui = n === DONE && idx !== DONE;
  idx = n;
  render();
  if(entersNewPart) showChapter(QUESTIONS[n].part);
  if(conclui) sendToCrm();
}

/* ---- Envio para o CRM ----------------------------------------------------
   Monta o payload no formato que POST /api/diagnosticos espera: um mapa
   questionId → resposta, com o texto de "Outro" já embutido na resposta.
   Falha em silêncio de propósito: o diagnóstico do usuário não pode depender
   do CRM estar no ar. O PDF continua sendo o comprovante dele.
   -------------------------------------------------------------------------- */
function crmPayload(){
  const out = {};
  QUESTIONS.forEach(qd=>{
    const bruto = answers[qd.id];
    const other = (answers[qd.id+"__other"]||"").trim();

    // O relato vai em chave própria: se entrasse na lista de opções, um
    // parágrafo viraria "categoria" nos gráficos do CRM.
    const detalhe = (answers[qd.id+"__detalhe"]||"").trim();
    if(detalhe) out[qd.id+"__detalhe"] = detalhe;

    if(Array.isArray(bruto)){
      // "__other" é só um marcador interno; o que vale é o texto digitado.
      const lista = bruto.filter(x=>x!=="__other");
      if(other) lista.push(other);
      if(lista.length) out[qd.id] = lista;
      return;
    }

    let texto = (bruto||"").trim();
    if(other) texto = texto ? texto+" · Outro: "+other : "Outro: "+other;
    if(texto) out[qd.id] = texto;
  });
  return out;
}

function sendToCrm(){
  if(!CRM_ENDPOINT) return;   // sem CRM configurado, não faz nada
  const headers = { "Content-Type": "application/json" };
  if(CRM_TOKEN) headers["X-Ingest-Token"] = CRM_TOKEN;

  fetch(CRM_ENDPOINT, {
    method: "POST",
    headers,
    // keepalive: a requisição sobrevive se a pessoa fechar a aba na sequência.
    keepalive: true,
    body: JSON.stringify({
      answers: crmPayload(),
      submittedAt: new Date().toISOString(),
      origem: location.host,
    }),
  }).catch(err => console.warn("[crm] não foi possível enviar o diagnóstico:", err));
}

/* ---- Interstitial de troca de parte ----
   Partes com texto de transição (PART_INTROS) não somem sozinhas: existem
   para serem lidas, então esperam a pessoa avançar. */
const PART_INTROS = {
  "Parte 4 · Além do site":
    "Até aqui entendemos o projeto do site. Agora são algumas perguntas rápidas sobre a empresa como um todo. Elas são opcionais, mas costumam revelar oportunidades que passam despercebidas.",
};

let chapterActive = false, chapterTimer;
function showChapter(part){
  const bits = part.split(" · ");
  const hasSplit = bits.length > 1;
  const eyebrow = hasSplit ? bits[0] : "Para terminar";
  const title = hasSplit ? bits.slice(1).join(" · ") : part;
  const pi = PARTS.indexOf(part);
  const intro = PART_INTROS[part];

  const ov = el("div","chapter-ov");
  ov.setAttribute("role","status");
  ov.innerHTML = `<div class="inner">
    <div class="num"><span class="line"></span>${escapeHtml(eyebrow)}</div>
    <h2>${escapeHtml(title)}</h2>
    ${intro ? `<p class="lead">${escapeHtml(intro)}</p>` : ""}
    <div class="segs">${PARTS.map((_,i)=>`<span class="seg${i<=pi?" on":""}"></span>`).join("")}</div>
    <div class="tap">toque ou pressione Enter para continuar</div>
  </div>`;
  document.body.appendChild(ov);
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  chapterActive = true;
  requestAnimationFrame(()=>ov.classList.add("is-in"));

  const dismiss = ()=>{
    if(!chapterActive) return;
    chapterActive = false;
    clearTimeout(chapterTimer);
    ov.classList.remove("is-in");
    document.removeEventListener("keydown", onKey, true);
    ov.removeEventListener("click", dismiss);
    setTimeout(()=>{ ov.remove(); focusStep(); }, 480);
  };
  const onKey = (e)=>{ e.preventDefault(); e.stopPropagation(); if(/^(Enter| |Escape|ArrowRight)$/.test(e.key)) dismiss(); };
  ov.addEventListener("click", dismiss);
  document.addEventListener("keydown", onKey, true);

  // Com texto de transição não há relógio: quem fecha é quem lê.
  if(!intro){
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    chapterTimer = setTimeout(dismiss, reduce ? 1100 : 2000);
  }
}
function focusStep(){
  const active = wrap.querySelector(".step.is-active");
  if(active){ const f = active.querySelector("textarea, .choice, .btn--go, input"); if(f) f.focus(); }
}

btnBack.addEventListener("click", ()=>{ if(idx===REVIEW) go(TOTAL-1); else if(idx>0) go(idx-1); });
btnNext.addEventListener("click", ()=>{ if(idx===REVIEW) go(DONE); else go(idx+1); });

/* ---- Teclado global ---- */
document.addEventListener("keydown", (e)=>{
  if(chapterActive) return;   // o interstitial trata o próprio teclado
  if(idx<0 || idx>=DONE) return;
  const inField = /^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName);
  // Enter avança (menos Shift+Enter em textarea)
  if(e.key==="Enter" && !e.shiftKey){
    if(document.activeElement.tagName==="TEXTAREA"){ e.preventDefault(); if(!btnNext.disabled) btnNext.click(); return; }
    if(!inField){ e.preventDefault(); if(!btnNext.disabled) btnNext.click(); return; }
  }
  // Atalhos numéricos p/ escolhas
  if(idx<REVIEW && !inField && /^[1-9]$/.test(e.key)){
    const qd = QUESTIONS[idx];
    if(qd.type==="single"||qd.type==="multi"){
      const btn = wrap.querySelectorAll(".choices .choice")[parseInt(e.key,10)-1];
      if(btn){ e.preventDefault(); btn.click(); }
    }
  }
});

/* ---- Toast ---- */
let toastT;
function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("is-on");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("is-on"), 2200);
}

/* ---- Ícones ---- */
function icon(name){
  const p = {
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    nav:'<path d="M4 12h16"/><path d="M10 6l-6 6 6 6"/><path d="M14 6l6 6-6 6"/>',
    lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'
  }[name];
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
}

/* ---- Boot ---- */
render();
</script>
